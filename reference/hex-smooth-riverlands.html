  const e=.002,dx=(riverBankHeight(cell.river,wx+e,wz)-riverBankHeight(cell.river,wx-e,wz))/(2*e),dz=(riverBankHeight(cell.river,wx,wz+e)-riverBankHeight(cell.river,wx,wz-e))/(2*e),length=Math.hypot(dx,1,dz);normals.push(-dx/length,1/length,-dz/length);

}
function makeLandBankJoin(parent,data){
 if(!data.shoreCornerHeights)return;
 const points=[];
 for(let sector=0;sector<6;sector++)if(data.shoreLinks[(7-sector)%6]){
  const corner=(k,outer)=>{k%=6;const a=k*Math.PI/3,x=outer?Math.sin(a):data.corners?data.corners[k][0]:Math.sin(a)*TOP_RADIUS,z=outer?Math.cos(a):data.corners?data.corners[k][1]:Math.cos(a)*TOP_RADIUS,y=outer?data.shoreCornerHeights[k]-data.top:data.surface?surfaceHeight(data.surface,x,z):0;return [x,y,z];};
  const a=corner(sector,false),b=corner(sector+1,false),c=corner(sector,true),d=corner(sector+1,true);points.push(...a,...c,...d,...a,...d,...b);

}
function makeRiver(parent,data){
 const surface=data.riverSurface,water=[],cliffs=[],normals=[];
 if(surface.triangles.length)addMesh(parent,smoothTerrainGeometry(surface,data),materials.riverGround);
 for(let k=0;k<6;k++){const a=data.riverCorners[k],b=data.riverCorners[(k+1)%6];water.push(0,0,0,a[0],0,a[1],b[0],0,b[1]);}
 const waterMesh=addMesh(parent,geometryFrom(water),materials.water);waterMesh.castShadow=false;
 function normal(p){const x=data.wx+p[0],z=data.wz+p[2],e=.002,dx=riverLandValue(data.river,x+e,z)-riverLandValue(data.river,x-e,z),dz=riverLandValue(data.river,x,z+e)-riverLandValue(data.river,x,z-e),length=Math.hypot(dx,dz)||1;return [-dx/length,0,-dz/length];}
 function wall(a,b,na=normal(a),nb=normal(b)){
  if((b[2]-a[2])*na[0]-(b[0]-a[0])*na[2]<0){[a,b]=[b,a];[na,nb]=[nb,na];}
  const c=[a[0],-.008,a[2]],d=[b[0],-.008,b[2]];cliffs.push(...a,...b,...c,...b,...d,...c);normals.push(...na,...nb,...na,...nb,...nb,...na);

 // At the map edge, close exposed land. At neighbouring land, only close a
 // water-reaching section; otherwise the matching bank and land form one top.

  const a=data.riverCorners[k],b=data.riverCorners[(k+1)%6],land=data.riverLandSides[(7-k)%6],at=t=>{const x=a[0]+(b[0]-a[0])*t,z=a[1]+(b[1]-a[1])*t;return {x,z,v:riverLandValue(data.river,data.wx+x,data.wz+z)};};
  for(let j=0;j<28;j++){
   let p=at(j/28),q=at((j+1)/28);const keep=v=>land?v<0:v>=0;if(!keep(p.v)&&!keep(q.v))continue;
   if(keep(p.v)!==keep(q.v)){const t=p.v/(p.v-q.v),m={x:p.x+(q.x-p.x)*t,z:p.z+(q.z-p.z)*t,v:0};if(keep(p.v))q=m;else p=m;}
   const point=p=>[p.x,riverBankHeight(data.river,data.wx+p.x,data.wz+p.z),p.z],dx=b[0]-a[0],dz=b[1]-a[1],length=Math.hypot(dx,dz),n=land?[-dz/length,0,dx/length]:[dz/length,0,-dx/length];wall(point(p),point(q),n,n);
  }

function timberBetween(parent,a,b,width,material){const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),delta=new THREE.Vector3().subVectors(end,start),mesh=addMesh(parent,new THREE.CylinderGeometry(width,width,delta.length(),5),material);mesh.position.copy(start.add(end).multiplyScalar(.5));mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());return mesh;}
function makeStoneBridge(parent,length,heights){
 const arch=t=>heights[0]*(1-t)+heights[1]*t+.025+.10*Math.sin(Math.PI*t),points=[];
 for(let j=0;j<20;j++){
  const ta=j/20,tb=(j+1)/20,xa=(ta-.5)*length,xb=(tb-.5)*length,ya=arch(ta),yb=arch(tb);
  const a=[xa,ya,-.125],b=[xb,yb,-.125],c=[xa,ya,.125],d=[xb,yb,.125];points.push(...a,...c,...b,...b,...c,...d);
  for(const sign of [-1,1]){const z=sign*.125,lowA=ya-.085,lowB=yb-.085;points.push(xa,ya,z,xb,yb,z,xa,lowA,z,xb,yb,z,xb,lowB,z,xa,lowA,z);}
 }
 const mesh=addMesh(parent,geometryFrom(points),materials.rock);mesh.material.side=THREE.DoubleSide;
 for(const side of [-1,1])for(let j=0;j<9;j++){const t=(j+.5)/9;addMesh(parent,new THREE.BoxGeometry(length/9*.98,.06,.035),materials.rockLight,(t-.5)*length,arch(t)+.025,side*.13);}

function makeCrossing(parent,crossing){

 if(crossing.kind==='bridge'){
  if(crossing.material==='stone'){makeStoneBridge(g,length,crossing.heights);return;}
  const count=Math.ceil(length/.085),arch=t=>crossing.heights[0]*(1-t)+crossing.heights[1]*t+.02+.075*Math.sin(t*Math.PI);
  for(let j=0;j<count;j++){const t=(j+.5)/count;addMesh(g,new THREE.BoxGeometry(length/count*.94,.028,.225),j%3===0?materials.bridgeLight:materials.bridgeWood,(t-.5)*length,arch(t),0);}
  for(const z of [-.127,.127]){
   for(let j=0;j<5;j++){const t=j/4,x=(t-.5)*length,y=arch(t);addMesh(g,new THREE.CylinderGeometry(.012,.014,.15,5),materials.bridgeDark,x,y+.065,z);if(j<4){const t2=(j+1)/4;timberBetween(g,[x,y+.13,z],[(t2-.5)*length,arch(t2)+.13,z],.010,materials.bridgeLight);}}
   for(let j=0;j<4;j++){const t=j/4,t2=(j+1)/4;timberBetween(g,[(t-.5)*length,arch(t)-.035,z*.65],[(t2-.5)*length,arch(t2)-.035,z*.65],.018,materials.bridgeDark);}
  }
  for(const t of [.24,.76])for(const z of [-.085,.085]){const height=arch(t)-.02;addMesh(g,new THREE.CylinderGeometry(.018,.024,height,5),materials.bridgeDark,(t-.5)*length,height/2,z);}
 }else{
  for(const sign of [-1,1]){
   const dock=new THREE.Group();dock.userData.prop='dock';g.add(dock);const x=sign*length/2,bank=crossing.heights[sign===-1?0:1],height=bank+.018;
   for(let j=0;j<7;j++)addMesh(dock,new THREE.BoxGeometry(.039,.025,.23),j%2?materials.bridgeWood:materials.bridgeLight,x-sign*(j*.037),height,0);
   for(const d of [.025,.215])for(const z of [-.095,.095]){const h=height+.045;addMesh(dock,new THREE.CylinderGeometry(.014,.018,h,5),materials.bridgeDark,x-sign*d,h/2,z);}
   timberBetween(dock,[x,height-.028,-.075],[x-sign*.24,height-.028,-.075],.015,materials.bridgeDark);timberBetween(dock,[x,height-.028,.075],[x-sign*.24,height-.028,.075],.015,materials.bridgeDark);
  }
  const boat=new THREE.Group();boat.userData.prop='ferry';boat.position.x=(crossing.boatPosition-.5)*length;g.add(boat);
  const outline=[[-.18,0],[-.11,-.13],[.12,-.13],[.19,0],[.12,.13],[-.11,.13]],hull=[];
  for(let k=0;k<6;k++){const a=outline[k],b=outline[(k+1)%6],bottomA=[a[0]*.74,.008,a[1]*.74],bottomB=[b[0]*.74,.008,b[1]*.74],topA=[a[0],.072,a[1]],topB=[b[0],.072,b[1]];hull.push(...bottomA,...topA,...bottomB,...bottomB,...topA,...topB);}
  const hullMesh=addMesh(boat,geometryFrom(hull),materials.bridgeDark);hullMesh.material.side=THREE.DoubleSide;
  for(let j=0;j<6;j++)addMesh(boat,new THREE.BoxGeometry(.041,.019,.20),j%2?materials.bridgeLight:materials.bridgeWood,-.11+j*.044,.05,0);
  for(const x of [-.08,.085])addMesh(boat,new THREE.BoxGeometry(.035,.025,.21),materials.bridgeWood,x,.088,0);
  timberBetween(boat,[-.13,.105,.04],[.19,.105,.17],.008,materials.bridgeLight);

}

function buildMap(seed){
 const old=new Set();map.traverse(o=>{if(o.geometry)old.add(o.geometry);});map.clear();old.forEach(g=>g.dispose());cells.length=0;
 const layout=makeLayout(seed);
 for(const data of layout){
  const g=new THREE.Group();g.position.set(Math.sqrt(3)*(data.q+data.r/2),0,1.5*data.r);const water=data.type==='Water';
  const tile=addMesh(g,bevelTile(data.top,water,water?data.riverCorners:data.corners,water?data.riverShared:data.surface?data.shared:null),[materials.side,water?materials.waterDeep:materials.bevel,water?materials.water:data.tone?materials.groundLight:materials.ground]);
  const content=new THREE.Group();content.position.y=data.top;g.add(content);
  if(data.surface)makeRidge(content,data.surface);
  if(water)makeRiver(content,data);else makeLandBankJoin(content,data);
  for(const prop of data.props){
   if(prop.kind==='tree')makeTree(content,prop);else if(prop.kind==='house')makeHouse(content,prop);else if(prop.kind==='tower')makeTower(content,prop);else if(prop.kind==='rock')makeRock(content,prop);else if(prop.kind==='grass')makeGrass(content,prop);
   else{const mesh=addMesh(content,new THREE.BoxGeometry(.18*prop.scale,.003,.015),materials.waterEdge,prop.x,.003,prop.z);mesh.rotation.y=prop.angle;mesh.castShadow=false;}
  }
  g.traverse(o=>{if(o.isMesh)o.userData.key=data.key;});map.add(g);cells.push({...data,g});
 }
 root.dataset.generation=String(seed);
}
function ringGeometry(cell){
 const points=[],surface=cell.surface||cell.riverSurface,mountain=!!surface,n=cell.riverSurface?28:mountain?8:1;
 const corners=cell.riverCorners||cell.corners||Array.from({length:6},(_,k)=>[Math.sin(k*Math.PI/3),Math.cos(k*Math.PI/3)]);
 function point(k,t,factor){const a=corners[k],b=corners[(k+1)%6],x=(a[0]+(b[0]-a[0])*t)*factor,z=(a[1]+(b[1]-a[1])*t)*factor;return [x,cell.top+(mountain?Math.max(0,surfaceHeight(surface,x,z)):0)+.018,z];}
 for(let k=0;k<6;k++)for(let j=0;j<n;j++){const a=point(k,j/n,mountain?.966:.932),b=point(k,j/n,mountain?.996:.977),c=point(k,(j+1)/n,mountain?.996:.977),d=point(k,(j+1)/n,mountain?.966:.932);points.push(...a,...b,...c,...a,...c,...d);}

}
const activeRing=new THREE.Mesh(new THREE.BufferGeometry(),materials.line),hoverRing=new THREE.Mesh(new THREE.BufferGeometry(),materials.hover);scene.add(activeRing,hoverRing);hoverRing.visible=false;
function setRing(ring,cell){ring.geometry.dispose();ring.geometry=ringGeometry(cell);ring.position.set(cell.g.position.x,0,cell.g.position.z);}
let selected=villageKey,hovered=null,zoom=1;const selection=root.querySelector('#hp-selection');buildMap(generation);cells.forEach(cell=>{const option=document.createElement('option');option.value=cell.key;selection.append(option);});
function updateSelectionLabels(){for(const cell of cells){const option=Array.from(selection.options).find(o=>o.value===cell.key);option.textContent=cell.q+', '+cell.r+' · '+(cell.type==='Woodland'?(cell.sparse?'Light woodland':'Dense woodland'):cell.type==='Water'?'River'+(cell.hasIsland?' · Island':'')+(cell.crossing?' · '+(cell.crossing.kind==='bridge'?'Bridge':'Ferry'):''):cell.type);}}
function choose(key){selected=key;hoverRing.visible=false;const cell=cells.find(c=>c.key===key);setRing(activeRing,cell);selection.value=key;updateSelectionLabels();draw();}
selection.addEventListener('change',()=>choose(selection.value));
root.querySelector('#hp-regenerate').addEventListener('click',()=>{generation=1+Math.floor(Math.random()*1000000);buildMap(generation);hovered=null;hoverRing.visible=false;choose(selected);});
function applyPalette(){const base=fromHex(seeds[0]);const bg=color(0,Math.min(.25,Math.max(.16,base[0]-.015)),1);scene.background=new THREE.Color(bg);root.style.setProperty('--hp-bg',bg);root.style.setProperty('--hp-text',color(2,.91,.2));root.style.setProperty('--hp-muted',color(0,.73,.35));root.style.setProperty('--hp-line',color(0,.38,.7));Object.entries(roles).forEach(([key,args])=>materials[key].color.set(color(...args)));materials.line.color.set(color(2,.94,.55));materials.hover.color.set(color(2,.83,.4));['ground','water','elements'].forEach((name,i)=>{root.querySelector('#hp-'+name).value=seeds[i];root.querySelector('#hp-'+name+'-value').textContent=seeds[i];});draw();}
root.querySelector('#hp-preset').addEventListener('change',e=>{if(palettes[e.target.value]){seeds=palettes[e.target.value].slice();applyPalette();}});
['ground','water','elements'].forEach((name,i)=>root.querySelector('#hp-'+name).addEventListener('input',e=>{seeds[i]=e.target.value;root.querySelector('#hp-preset').value='custom';applyPalette();}));
function draw(){renderer.render(scene,camera);}
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);const vertical=Math.max(4.4,5.9/(w/h));camera.left=-vertical*w/h;camera.right=vertical*w/h;camera.top=vertical;camera.bottom=-vertical;camera.zoom=zoom;camera.updateProjectionMatrix();draw();}
function changeZoom(factor){zoom=Math.min(2.8,Math.max(.7,zoom*factor));camera.zoom=zoom;camera.updateProjectionMatrix();draw();}
root.querySelector('#hp-in').addEventListener('click',()=>changeZoom(1.2));root.querySelector('#hp-out').addEventListener('click',()=>changeZoom(1/1.2));
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();function hit(x,y){const rect=host.getBoundingClientRect();mouse.set((x-rect.left)/rect.width*2-1,-(y-rect.top)/rect.height*2+1);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(map.children,true);return hits.length?hits[0].object.userData.key:null;}
const pointers=new Map();let last=null,start=null,pinched=false,pinchDistance=0;
host.addEventListener('pointerdown',e=>{if(e.button!==0)return;host.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){last={x:e.clientX,y:e.clientY};start={...last};pinched=false;}else{pinched=true;const [a,b]=[...pointers.values()];pinchDistance=Math.hypot(a.x-b.x,a.y-b.y);}hoverRing.visible=false;});
host.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinchDistance>0)changeZoom(d/pinchDistance);pinchDistance=d;return;}if(last){const dx=e.clientX-last.x,dy=e.clientY-last.y;const scale=(camera.right-camera.left)/(host.clientWidth*zoom);const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);const up=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);camera.position.addScaledVector(right,-dx*scale).addScaledVector(up,dy*scale);last={x:e.clientX,y:e.clientY};draw();}return;}if(e.pointerType==='mouse'){const key=hit(e.clientX,e.clientY);if(key!==hovered){hovered=key;hoverRing.visible=!!key&&key!==selected;if(hoverRing.visible){const c=cells.find(c=>c.key===key);setRing(hoverRing,c);}draw();}}});
function release(e){const wasLast=pointers.size===1;pointers.delete(e.pointerId);if(wasLast&&!pinched&&start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)<6){const key=hit(e.clientX,e.clientY);if(key)choose(key);}last=null;start=null;if(pointers.size===1)last=[...pointers.values()][0];}
host.addEventListener('pointerup',release);host.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);last=null;start=null;});host.addEventListener('pointerleave',()=>{hoverRing.visible=false;draw();});host.addEventListener('wheel',e=>{e.preventDefault();changeZoom(Math.exp(-e.deltaY*.001));},{passive:false});
new ResizeObserver(resize).observe(host);applyPalette();choose(villageKey);resize();loading.hidden=true;
})();
</script>
